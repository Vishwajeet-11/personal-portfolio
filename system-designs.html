<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="assets/images/terminal.svg" />
    <title>System Designs – Vishwajeet Bharadia</title>
    <link rel="stylesheet" href="assets/css/navbar.css" />
    <link rel="stylesheet" href="assets/css/index.css" />
    <style>
      .grid-container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 1rem;
        margin-top: 2rem;
      }
      .grid-item {
        border: 1px solid var(--hr-color);
        border-radius: 10px;
        padding: 0.5rem;
        background: var(--code-bg);
        text-align: center;
        transition: transform 0.2s ease;
        cursor: pointer;
      }
      .grid-item:hover {
        transform: scale(1.03);
      }
      .grid-item img {
        max-width: 100%;
        height: auto;
        border-radius: 6px;
      }
      .caption {
        margin-top: 0.5rem;
        font-size: 0.9rem;
        color: var(--text-color);
      }

      /* Fullscreen modal */
      .lightbox {
        display: none;
        position: fixed;
        z-index: 9999;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.9);
        justify-content: center;
        align-items: center;
      }
      .lightbox img {
        max-width: 90%;
        max-height: 90%;
        border-radius: 10px;
      }
      .lightbox:target {
        display: flex;
      }
      .close-btn {
        position: absolute;
        top: 20px;
        right: 30px;
        font-size: 2rem;
        color: white;
        cursor: pointer;
        text-decoration: none;
      }

      /* Theme-aware image switching for KYC verification, Netflix, and Chat App */
      .kyc-img,
      .kyc-img-lightbox,
      .netflix-img,
      .netflix-img-lightbox,
      .chat-app-img,
      .chat-app-lightbox {
        max-width: 100%;
        height: auto;
      }

      /* Hide dark image in light mode */
      .theme-dark {
        display: none;
      }

      /* Hide light image in dark mode */
      [data-theme="dark"] .theme-light {
        display: none;
      }

      /* Show dark image in dark mode */
      [data-theme="dark"] .theme-dark {
        display: block;
      }

      /* Ensure grid item images work correctly */
      .grid-item .kyc-img,
      .grid-item .netflix-img,
      .grid-item .chat-app-img {
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <script src="assets/js/navbar.js"></script>

    <h1>System Design Diagrams</h1>
    <p>Click an image to view it in full-screen mode.</p>

    <div class="grid-container">
      <div class="grid-item">
        <a href="#img1">
          <img
            src="assets/images/E-commerce-system-design.png"
            alt="E-commerce Application"
          />
        </a>
        <div class="caption">E-commerce Application</div>
      </div>
      <!-- <div class="grid-item">
        <a href="#img2">
          <img src="assets/images/bookstore.png" alt="Bookstore REST API" />
        </a>
        <div class="caption">Bookstore REST API</div>
      </div> -->
      <!-- <div class="grid-item">
        <a href="#img3">
          <img src="assets/images/chatapp.png" alt="Chat Application" />
        </a>
        <div class="caption">Chat Application</div>
      </div> -->
      <div class="grid-item">
        <a href="#img4">
          <img 
            src="assets/images/kyc-verification.png" 
            alt="KYC and Face-Recognition System" 
            class="kyc-img theme-light"
          />
          <img 
            src="assets/images/kyc-verification-dark.png" 
            alt="KYC and Face-Recognition System" 
            class="kyc-img theme-dark"
          />
        </a>
        <div class="caption">KYC and Face-Recognition System</div>
      </div>
      <div class="grid-item">
        <a href="#img5">
          <img 
            src="assets/images/netflix-system-design.png" 
            alt="Netflix System Design" 
            class="netflix-img theme-light"
          />
          <img 
            src="assets/images/netflix-system-design-dark.png" 
            alt="Netflix System Design" 
            class="netflix-img theme-dark"
          />
        </a>
        <div class="caption">Netflix System Design</div>
      </div>
      <div class="grid-item">
        <a href="#img6">
          <img 
            src="assets/images/chat-app.png" 
            alt="Distributed Messaging Platform" 
            class="chat-app-img theme-light"
          />
          <img 
            src="assets/images/chat-app-dark.png" 
            alt="Distributed Messaging Platform" 
            class="chat-app-img theme-dark"
          />
        </a>
        <div class="caption">Distributed Messaging Platform</div>
      </div>
    </div>

    <!-- Lightbox modals -->
    <div id="img1" class="lightbox">
      <a href="#" class="close-btn">✖</a>
      <img
        src="assets/images/E-commerce-system-design.png"
        alt="E-commerce Application"
      />
    </div>
    <div id="img2" class="lightbox">

    <div id="img3" class="lightbox">

    <div id="img6" class="lightbox">
      <a href="#" class="close-btn">✖</a>
      <img 
        src="assets/images/chat-app.png" 
        alt="Distributed messaging platform" 
        class="chat-app-lightbox theme-light"
      />
      <img

    </div>
    <p style="margin-top: 2rem">
      <a href="index.html">← Back to Portfolio</a>
    </p>

  </body>
</html>
